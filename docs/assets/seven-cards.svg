<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">4i7: семь карточек, четыре открытые стороны</title><desc id="desc">Семь рабочих столпов. Все 28 сторон остаются без определённого значения. Точка i относится к целому, не восьмой столп.</desc><rect width="1440" height="820" fill="#101d29"/><g font-family="Arial, sans-serif"><text x="48" y="55" fill="#f2ede0" font-size="30">4i7 · карта открытого понимания</text><text x="48" y="88" fill="#aebfcc" font-size="17">Авторские образы · рабочие названия · значения всех 28 сторон пока открыты</text><circle cx="1344" cy="45" r="9" fill="#eec974"/><path d="M1344 65v25" stroke="#eec974" stroke-width="6"/><text x="48" y="125" fill="#eec974" font-size="16">i — точка восприятия целого. Не восьмой столп и не технический агент.</text><g data-pillar="P1"><rect x="48" y="154" width="318" height="260" rx="15" fill="#1c2e3d" stroke="#526572"/><text x="66" y="189" fill="#f3e8cb" font-size="22">P1 · Идея</text><text x="66" y="215" fill="#aebfcc" font-size="14">Образ автора; смысл уточняем</text><g data-side="P1.front"><rect x="62" y="237" width="290" height="32" rx="5" fill="#142430"/><text x="72" y="258" fill="#bfccd4" font-size="15">P1.front</text><text x="254" y="258" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P1.right"><rect x="62" y="276" width="290" height="32" rx="5" fill="#142430"/><text x="72" y="297" fill="#bfccd4" font-size="15">P1.right</text><text x="254" y="297" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P1.back"><rect x="62" y="315" width="290" height="32" rx="5" fill="#142430"/><text x="72" y="336" fill="#bfccd4" font-size="15">P1.back</text><text x="254" y="336" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P1.left"><rect x="62" y="354" width="290" height="32" rx="5" fill="#142430"/><text x="72" y="375" fill="#bfccd4" font-size="15">P1.left</text><text x="254" y="375" fill="#eec974" font-size="14">Открыто</text></g></g><g data-pillar="P2"><rect x="390" y="154" width="318" height="260" rx="15" fill="#1c2e3d" stroke="#526572"/><text x="408" y="189" fill="#f3e8cb" font-size="22">P2 · Скелет связей</text><text x="408" y="215" fill="#aebfcc" font-size="14">Образ автора; смысл уточняем</text><g data-side="P2.front"><rect x="404" y="237" width="290" height="32" rx="5" fill="#142430"/><text x="414" y="258" fill="#bfccd4" font-size="15">P2.front</text><text x="596" y="258" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P2.right"><rect x="404" y="276" width="290" height="32" rx="5" fill="#142430"/><text x="414" y="297" fill="#bfccd4" font-size="15">P2.right</text><text x="596" y="297" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P2.back"><rect x="404" y="315" width="290" height="32" rx="5" fill="#142430"/><text x="414" y="336" fill="#bfccd4" font-size="15">P2.back</text><text x="596" y="336" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P2.left"><rect x="404" y="354" width="290" height="32" rx="5" fill="#142430"/><text x="414" y="375" fill="#bfccd4" font-size="15">P2.left</text><text x="596" y="375" fill="#eec974" font-size="14">Открыто</text></g></g><g data-pillar="P3"><rect x="732" y="154" width="318" height="260" rx="15" fill="#1c2e3d" stroke="#526572"/><text x="750" y="189" fill="#f3e8cb" font-size="22">P3 · Голос</text><text x="750" y="215" fill="#aebfcc" font-size="14">Образ автора; смысл уточняем</text><g data-side="P3.front"><rect x="746" y="237" width="290" height="32" rx="5" fill="#142430"/><text x="756" y="258" fill="#bfccd4" font-size="15">P3.front</text><text x="938" y="258" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P3.right"><rect x="746" y="276" width="290" height="32" rx="5" fill="#142430"/><text x="756" y="297" fill="#bfccd4" font-size="15">P3.right</text><text x="938" y="297" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P3.back"><rect x="746" y=