><rect x="732" y="439" width="318" height="260" rx="15" fill="#1c2e3d" stroke="#526572"/><text x="750" y="474" fill="#f3e8cb" font-size="22">P7 · Итог и память</text><text x="750" y="500" fill="#aebfcc" font-size="14">Предположительно; уточняем</text><g data-side="P7.front"><rect x="746" y="522" width="290" height="32" rx="5" fill="#142430"/><text x="756" y="543" fill="#bfccd4" font-size="15">P7.front</text><text x="938" y="543" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P7.right"><rect x="746" y="561" width="290" height="32" rx="5" fill="#142430"/><text x="756" y="582" fill="#bfccd4" font-size="15">P7.right</text><text x="938" y="582" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P7.back"><rect x="746" y="600" width="290" height="32" rx="5" fill="#142430"/><text x="756" y="621" fill="#bfccd4" font-size="15">P7.back</text><text x="938" y="621" fill="#eec974" font-size="14">Открыто</text></g><g data-side="P7.left"><rect x="746" y="639" width="290" height="32" rx="5" fill="#142430"/><text x="756" y="660" fill="#bfccd4" font-size="15">P7.left</text><text x="938" y="660" fill="#eec974" font-size="14">Открыто</text></g></g><text x="1080" y="489" fill="#eec974" font-size="21">Понятия целого</text><text x="1080" y="525" fill="#bfccd4" font-size="17">Два аспекта</text><text x="1080" y="555" fill="#bfccd4" font-size="17">Четвёртый выбор</text><text x="1080" y="585" fill="#bfccd4" font-size="17">Линии восприятия</text><text x="1080" y="615" fill="#bfccd4" font-size="17">Контракты и точка сборки</text><text x="1080" y="658" fill="#aebfcc" font-size="14">Не назначены отдельной ячейке</text><text x="48" y="760" fill="#bfccd4" font-size="18">Открытая ячейка — приглашение к исследованию, не отсутствие всего знания.</text><text x="48" y="790" fill="#aebfcc" font-size="15">Подробности и источники — в Markdown-карточках. Философская основа ≠ реализация оркестратора.</text></g></svg>