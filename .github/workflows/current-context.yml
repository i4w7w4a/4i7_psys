name: Current matrix context
on:
  pull_request:
  push:
    branches:
      - feat/current-matrix-runtime-20261117
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/validate_model.py
      - run: python3 scripts/validate_knowledge.py
      - run: python3 scripts/validate_runtime.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/demo_project_memory.py --root "$RUNNER_TEMP/4i7-memory-pilot"
      - run: |
          python3 scripts/context_pack.py --node P2 --format json > /tmp/p2.json
          python3 scripts/context_pack.py --node P3 --format json > /tmp/p3.json
          python3 scripts/context_pack.py --layer legacy --node P3 --format json > /tmp/legacy.json
